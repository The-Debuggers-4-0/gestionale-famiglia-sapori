# Workflow completo: Build, Test, Analisi Qualità e Coverage
name: Build and Analyze

# Trigger: esegue ad ogni push o pull request sul branch main
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    # Permessi necessari per pubblicare i risultati dei test come GitHub Check
    permissions:
      contents: read
      checks: write  # Per pubblicare risultati test come check
    
    steps:
      # Step 1: Scarica il codice sorgente dal repository
      # fetch-depth: 0 necessario per l'analisi completa di SonarCloud
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Disabilita cloni shallow per analisi migliore
      
      # Step 2: Installa Java 21 (versione richiesta dal progetto)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
      
      # Step 3: Cache dei pacchetti SonarCloud per velocizzare build successive
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      
      # Step 4: Cache delle dipendenze Maven per build più veloci
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      
      # Step 5: Build, test e analisi con SonarCloud
      # - Usa Xvfb per eseguire test JavaFX senza GUI (modalità headless)
      # - Genera report di coverage con JaCoCo
      # - Invia risultati a SonarCloud per analisi qualità
      - name: Build and analyze
        working-directory: famigliasapori
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token per info PR
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Token SonarCloud
          CI: true  # Attiva modalità headless per test JavaFX
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=The-Debuggers-4-0_gestionale-famiglia-sapori
      
      # Step 6: Pubblica i risultati dei test come GitHub Check
      # Mostra direttamente su GitHub quali test sono passati/falliti
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: famigliasapori/target/surefire-reports/*.xml
          check_name: Test Results
          comment_mode: off  # Non commenta automaticamente sui PR
      
      # Step 7: Carica i report dei test come artifact scaricabili
      # Utile per debugging in caso di fallimenti
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: famigliasapori/target/surefire-reports/
          retention-days: 30  # Conserva per 30 giorni
      
      # Step 8: Carica il report HTML di coverage come artifact
      # Report interattivo navigabile per vedere nel dettaglio quali righe sono coperte
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: famigliasapori/target/site/jacoco/
          retention-days: 30
